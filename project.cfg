# Project manifest

project: boilerplate
type: service
remotes:
  live:
    remote: origin
    url: 'git@github.com:NottInfra/boilerplate.git'
    branch: main
    release: release/production.ps1
  test:
    remote: gitlab
    url: 'ssh://git@gitlab.nottinfra.co.uk:2222/nottinfra-limited/boilerplate.git'
    branch: develop
    release: release/test.ps1
  configs:
    root: 'git@github.com:NottInfra'
    repos:
      - boilerplate
      - k8-inventory
      - grafana-dashboards
      - kibana-dashboards
      - elasticsearch-templates
      - blackbox-targets
      - keycloak-realms
      - caddy-internal
      - caddy-external
public:
  domains:
    - '{ DOMAIN}'
  ingress:
    ip: 104.152.211.241
    type: EXTERNAL
  dns:
    registry: SPACESHIP
    A:
      '@': 104.152.211.241
      www: 104.152.211.241
      test: 104.152.211.241
    CNAME:
      cdn: 'cdn.{ DOMAIN}.cdn.cloudflare.net'
